name: varipath
description: "A new Flutter project."

publish_to:


version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  http: ^1.5.0


  cupertino_icons: ^1.0.8
  characters: ^1.4.0
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  audioplayers: ^6.1.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/audio/sos_beep.wav

  fonts:
    - family: Kalam
      fonts:
        - asset: assets/fonts/Kalam-Regular.ttf
          weight: 400
        - asset: assets/fonts/Kalam-Light.ttf
          weight: 300
        - asset: assets/fonts/Kalam-Bold.ttf
          weight: 700

    - family: YatraOne
      fonts:
        - asset: assets/fonts/YatraOne-Regular.ttf
          weight: 400

    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-VariableFont_wght.ttf
